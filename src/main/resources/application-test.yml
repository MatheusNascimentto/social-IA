spring:
  datasource:
    url: jdbc:h2:mem:nexel_social_ai_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-jwt-validation
    expiration-minutes: 60
  ai:
    provider: openai
    openai:
      api-key: test-api-key
      base-url: https://api.openai.com/v1
      model: gpt-4o-mini
      timeout-seconds: 30
    ollama:
      base-url: http://localhost:11434
      model: llama3.2:latest
      timeout-seconds: 120

springdoc:
  swagger-ui:
    enabled: true
